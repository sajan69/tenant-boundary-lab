name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: local_admin_dummy_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          set -a
          . ./.env.example
          set +a
          bash scripts/verify.sh
      - run: |
          set -a
          . ./.env.example
          set +a
          python manage.py runserver 127.0.0.1:8765 --noreload > /tmp/boundary-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/demo_api.py --port 8765
      - run: |
          set -a
          . ./.env.example
          set +a
          python manage.py makemigrations --settings=boundary.migration_settings --check --dry-run
          python -m pip check
      - name: Record permission matrix and bounded API measurements
        run: |
          set -euo pipefail
          set -a
          . ./.env.example
          set +a
          mkdir -p artifacts
          python scripts/evaluate.py --disposable-lab | tee artifacts/evaluation.json
          python manage.py runserver 127.0.0.1:8766 --noreload > /tmp/boundary-measurement.log 2>&1 &
          measurement_pid=$!
          trap 'kill "$measurement_pid" 2>/dev/null || true' EXIT
          python scripts/demo_api.py --port 8766 > /dev/null
          python scripts/benchmark_api.py --disposable-lab --port 8766 | tee artifacts/benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-evidence-pg${{ matrix.postgres }}
          path: artifacts/*.json
      - uses: actions/setup-node@v4
        if: matrix.postgres == '18'
        with:
          node-version: '24'
      - name: Build React client and install Chromium
        if: matrix.postgres == '18'
        run: |
          npm ci --prefix frontend --ignore-scripts
          npm run build --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium
      - name: Verify built React against Django and PostgreSQL
        if: matrix.postgres == '18'
        run: |
          set -a
          . ./.env.example
          set +a
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/boundary-browser-api.log 2>&1 &
          api_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js preview) > /tmp/boundary-browser-client.log 2>&1 &
          client_pid=$!
          trap 'kill "$api_pid" "$client_pid" 2>/dev/null || true' EXIT
          npm run test:browser --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always() && matrix.postgres == '18'
        with:
          name: tenant-browser
          path: artifacts/
