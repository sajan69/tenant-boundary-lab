services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${PGADMIN_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
